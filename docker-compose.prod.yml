services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: clic-legal-web:latest
    container_name: clic-legal-web-1
    restart: always
    ports:
      - "127.0.0.1:3012:3012"   # sólo local; el nginx del host hace proxy_pass
    environment:
      - NODE_ENV=production
      - PORT=3012
      - DATA_DIR=/app/data
      - SMTP_HOST=host.docker.internal   # Postfix del host (entrega local a @clic.legal)
      - SMTP_PORT=25
      - LEAD_FROM=noreply@clic.legal
      - LEAD_FALLBACK=hola@clic.legal
    extra_hosts:
      - "host.docker.internal:host-gateway"   # permite alcanzar el :25 del host
    volumes:
      - /opt/clic-legal-web/data:/app/data:rw   # leads persistidos fuera del contenedor
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3012/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - cliclegalweb_net
networks:
  cliclegalweb_net:
    driver: bridge
